{{- if and .Values.metrics.enabled .Values.metrics.podMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ include "vcluster-argocd-enroller.fullname" . }}
  namespace: {{ include "vcluster-argocd-enroller.vclusterNamespace" . }}
  labels:
    {{- include "vcluster-argocd-enroller.labels" . | nindent 4 }}
    {{- with .Values.metrics.podMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "vcluster-argocd-enroller.selectorLabels" . | nindent 6 }}
  podMetricsEndpoints:
  - port: metrics
    {{- with .Values.metrics.podMonitor.interval }}
    interval: {{ . }}
    {{- end }}
{{- end }}

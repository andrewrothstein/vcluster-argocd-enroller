{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "vcluster-argocd-enroller.fullname" . }}
  labels:
    {{- include "vcluster-argocd-enroller.labels" . | nindent 4 }}
rules:
# Read vCluster-generated `vc-{name}` secrets cluster-wide. Write access to
# secrets is granted via a namespaced Role in the ArgoCD namespace, not here.
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["statefulsets"]
  verbs: ["get", "list", "watch", "patch", "update"]
# kopf records handler results in the object's status; without this it retries and stalls delete handling.
- apiGroups: ["apps"]
  resources: ["statefulsets/status"]
  verbs: ["get", "patch", "update"]
# kopf lists CRDs for resource discovery.
- apiGroups: ["apiextensions.k8s.io"]
  resources: ["customresourcedefinitions"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]
{{- if .Values.leaderElection.enabled }}
# kopf peering: each replica keeps its entry in the peering object's status alive and watches the others.
- apiGroups: ["kopf.dev"]
  resources: ["clusterkopfpeerings"]
  verbs: ["get", "list", "watch", "patch"]
{{- end }}
{{- with .Values.rbac.additionalRules }}
{{- toYaml . | nindent 0 }}
{{- end }}
{{- end }}

{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "vcluster-argocd-enroller.fullname" . }}
  namespace: {{ include "vcluster-argocd-enroller.vclusterNamespace" . }}
  labels:
    {{- include "vcluster-argocd-enroller.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "vcluster-argocd-enroller.selectorLabels" . | nindent 6 }}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow kubelet liveness/readiness probes (and other health checks) on the health port
  - ports:
    - protocol: TCP
      port: {{ .Values.networkPolicy.healthPort }}
  {{- with .Values.networkPolicy.ingress }}
    {{- toYaml . | nindent 2 }}
  {{- end }}
  egress:
  # Allow DNS
  - to:
    - namespaceSelector: {}
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  # Allow Kubernetes API. The API server is not a pod on k3s, k3d, RKE2 and most managed clusters,
  # so it is matched by address and port. additionalPorts covers distributions that NAT the
  # kubernetes Service ClusterIP to another port (e.g. 6443) before policy evaluation.
  - to:
    - ipBlock:
        cidr: {{ .Values.networkPolicy.apiServer.cidr }}
    ports:
    - protocol: TCP
      port: {{ .Values.networkPolicy.apiServer.port }}
    {{- range .Values.networkPolicy.apiServer.additionalPorts }}
    - protocol: TCP
      port: {{ . }}
    {{- end }}
  {{- with .Values.networkPolicy.egress }}
    {{- toYaml . | nindent 2 }}
  {{- end }}
{{- end }}

# Default values for vcluster-argocd-enroller.

# Replica count for the operator deployment. More than one needs leaderElection.enabled:
# only one replica works at a time, the others are standbys.
replicaCount: 1

# Leader election between replicas
leaderElection:
  # Elect one active replica through a kopf ClusterKopfPeering object; a standby takes over about
  # a minute after the active one is gone. Needs the ClusterKopfPeering CRD from this chart's crds/
  # directory, which Helm installs with `helm install` but not with `helm upgrade`: apply it by hand
  # before turning this on for a release installed from a chart older than 2.0.0.
  enabled: false

# Image configuration
image:
  repository: ghcr.io/andrewrothstein/vcluster-argocd-enroller
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

# Image pull secrets
imagePullSecrets: []

# Override the name of the chart
nameOverride: ""
# Override the fullname of the chart
fullnameOverride: ""

# ServiceAccount configuration
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# Pod annotations
podAnnotations: {}

# Pod security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

# Container security context
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

# Resource limits and requests
resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Node selector for pod scheduling
nodeSelector: {}

# Tolerations for pod scheduling
tolerations: []

# Affinity rules for pod scheduling
affinity: {}

# Operator configuration
operator:
  # Namespace the operator is deployed into. vClusters are watched in every namespace.
  vclusterNamespace: vcluster-system

  # Namespace where ArgoCD is deployed
  argoCDNamespace: argocd

  # Address ArgoCD reaches each vCluster at; {name} and {namespace} are replaced with the vCluster's.
  # The certificate a vCluster serves is valid for <name>.<namespace> but not for
  # <name>.<namespace>.svc.cluster.local, unless that is listed in its controlPlane.proxy.extraSANs.
  serverURL: "https://{name}.{namespace}"

  # Log level (DEBUG, INFO, WARNING, ERROR)
  logLevel: INFO

  # Seconds between re-syncs of each vCluster. A re-sync picks up credentials vcluster has rotated
  # and restores an ArgoCD secret that was changed or removed; it writes nothing when all is in sync.
  resyncInterval: 300

# Additional environment variables for the operator
env: []
  # - name: EXAMPLE_VAR
  #   value: "example-value"

# Additional volume mounts for the operator
volumeMounts: []
  # - name: extra-config
  #   mountPath: /etc/extra-config
  #   readOnly: true

# Additional volumes for the operator
volumes: []
  # - name: extra-config
  #   configMap:
  #     name: extra-config

# RBAC configuration
rbac:
  # Create RBAC resources
  create: true

  # Additional rules to add to the ClusterRole
  additionalRules: []
    # - apiGroups: [""]
    #   resources: ["pods"]
    #   verbs: ["get", "list"]

# Network policy configuration
networkPolicy:
  # Enable network policy
  enabled: true

  # Port the operator serves health probes on (also used with the policy disabled); ingress is
  # allowed to it so kubelet probes work
  healthPort: 8080

  # Kubernetes API server egress. The API server is usually not a pod, so it is allowed by
  # address and port. Tighten cidr to your API endpoint (e.g. 10.0.0.5/32) where known.
  apiServer:
    cidr: 0.0.0.0/0
    port: 443
    # Extra ports, for distributions that NAT the kubernetes Service to e.g. 6443 before policy applies
    additionalPorts:
      - 6443

  # Additional ingress rules
  ingress: []

  # Additional egress rules
  egress: []

# Pod Disruption Budget configuration
podDisruptionBudget:
  enabled: false
  minAvailable: 1
  # maxUnavailable: 1

# Autoscaling configuration
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Priority class for the operator pods
priorityClassName: ""

# Lifecycle hooks
lifecycle: {}
  # preStop:
  #   exec:
  #     command: ["/bin/sh", "-c", "sleep 15"]

# Liveness probe configuration
livenessProbe:
  enabled: true
  initialDelaySeconds: 30
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3
  successThreshold: 1

# Readiness probe configuration
readinessProbe:
  enabled: true
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
  successThreshold: 1

# Extra labels to add to all resources
extraLabels: {}

# Extra annotations to add to all resources
extraAnnotations: {}

---
version: '3'

tasks:
  install:
    desc: "Install dependencies"
    cmds:
      - uv sync

  install-dev:
    desc: "Install with dev dependencies"
    cmds:
      - uv sync --all-extras

  build:
    desc: "Build Docker image"
    cmds:
      - docker build -t vcluster-argocd-enroller .

  dev:
    desc: "Run in development mode"
    cmds:
      - uv run vcluster-argocd-enroller --dev --verbose

  test:
    desc: "Run all tests"
    deps: [install-dev]
    cmds:
      - uv run pytest tests/ -v

  test-quick:
    desc: "Run quick tests (skip integration)"
    deps: [install-dev]
    cmds:
      - uv run pytest tests/ -v -m "not integration"

  test-integration:
    desc: "Run integration tests with real vcluster"
    deps: [install-dev]
    cmds:
      - uv run pytest tests/test_enrollment.py::TestVClusterEnrollment::test_vcluster_enrollment_lifecycle -v -s

  test-cli:
    desc: "Test CLI commands"
    deps: [install-dev]
    cmds:
      - uv run pytest tests/ -v -m "cli or not operator"

  test-single:
    desc: "Run a single test with vcluster lifecycle"
    vars:
      TEST_NAME: '{{ .TEST_NAME | default "test_vcluster_enrollment_lifecycle" }}'
    deps: [install-dev]
    cmds:
      - uv run pytest tests/ -k {{ .TEST_NAME }} -v -s

  coverage:
    desc: "Run tests with coverage"
    deps: [install-dev]
    cmds:
      - uv run pytest tests/ --cov=vcluster_argocd_enroller --cov-report=term-missing

  clean:
    desc: "Clean build artifacts"
    cmds:
      - rm -rf dist/ build/ *.egg-info .venv __pycache__
      - find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
      - rm -rf .pytest_cache .coverage htmlcov
      - rm -f test-enrollment.sh

  helm-lint:
    desc: "Lint Helm chart"
    cmds:
      - helm lint helm/vcluster-argocd-enroller

  helm-package:
    desc: "Package Helm chart"
    cmds:
      - helm package helm/vcluster-argocd-enroller -d dist/

  helm-install:
    desc: "Install Helm chart"
    vars:
      NAMESPACE: '{{ .NAMESPACE | default "vcluster-system" }}'
      RELEASE: '{{ .RELEASE | default "vcluster-argocd-enroller" }}'
    cmds:
      - helm upgrade --install {{ .RELEASE }} ./helm/vcluster-argocd-enroller --namespace {{ .NAMESPACE }} --create-namespace

  helm-uninstall:
    desc: "Uninstall Helm chart"
    vars:
      NAMESPACE: '{{ .NAMESPACE | default "vcluster-system" }}'
      RELEASE: '{{ .RELEASE | default "vcluster-argocd-enroller" }}'
    cmds:
      - helm uninstall {{ .RELEASE }} --namespace {{ .NAMESPACE }}

  helm-template:
    desc: "Render Helm chart templates"
    vars:
      NAMESPACE: '{{ .NAMESPACE | default "vcluster-system" }}'
    cmds:
      - helm template vcluster-argocd-enroller ./helm/vcluster-argocd-enroller --namespace {{ .NAMESPACE }}

  k3d-up:
    desc: "Create a k3d cluster, build the image, and install the chart"
    vars:
      CLUSTER: '{{ .CLUSTER | default "enroller-test" }}'
    cmds:
      - k3d cluster delete {{ .CLUSTER }}
      - k3d cluster create {{ .CLUSTER }} --agents 1 --no-lb --k3s-arg "--disable=traefik,servicelb,metrics-server@server:*"
      - docker build -t vcluster-argocd-enroller:test .
      - k3d image import vcluster-argocd-enroller:test -c {{ .CLUSTER }}
      - kubectl create namespace vcluster-system
      - kubectl create namespace argocd
      - >-
        helm install test-release ./helm/vcluster-argocd-enroller --namespace vcluster-system --wait --timeout 3m
        --set image.repository=vcluster-argocd-enroller --set image.tag=test --set image.pullPolicy=Never
        --set networkPolicy.enabled=true --set operator.logLevel=DEBUG --set readinessProbe.initialDelaySeconds=5 --set readinessProbe.periodSeconds=5
        --set livenessProbe.initialDelaySeconds=15

  k3d-smoke:
    desc: "Verify the operator is Ready under its NetworkPolicy, then enroll a fake vCluster and check ArgoCD secret create/delete"
    cmds:
      - kubectl -n vcluster-system get networkpolicy test-release-vcluster-argocd-enroller
      - kubectl -n vcluster-system wait --for=condition=Ready pod -l app.kubernetes.io/name=vcluster-argocd-enroller --timeout=120s
      - defer: kubectl delete -f tests/k3d/fake-vcluster.yaml --ignore-not-found --wait=false
      - kubectl apply -f tests/k3d/fake-vcluster.yaml
      - kubectl -n argocd wait --for=create secret/vcluster-smoke --timeout=60s
      - kubectl -n argocd get secret vcluster-smoke -o jsonpath='{.metadata.labels.argocd\.argoproj\.io/secret-type}' | grep -qx cluster
      - kubectl -n vcluster-system delete statefulset smoke --wait=false
      - kubectl -n argocd wait --for=delete secret/vcluster-smoke --timeout=60s
      - kubectl -n vcluster-system logs -l app.kubernetes.io/name=vcluster-argocd-enroller --tail=-1 | grep -ciE 'forbidden|Cannot connect|inconsistencies' | grep -qx 0

  k3d-down:
    desc: "Delete the k3d test cluster"
    vars:
      CLUSTER: '{{ .CLUSTER | default "enroller-test" }}'
    cmds:
      - k3d cluster delete {{ .CLUSTER }}

  k3d-test:
    desc: "Full local k3d integration test (cluster up, smoke test, cluster down)"
    cmds:
      - task: k3d-up
      - defer: { task: k3d-down }
      - task: k3d-smoke

  act-integration:
    desc: "Run the CI integration-test job locally with act (mounts k3d/kubectl, since the act image lacks them)"
    vars:
      # Must match k3d-version in ci.yaml: k3d-action reinstalls k3d unless that exact version is on PATH
      K3D_VERSION: '{{ .K3D_VERSION | default "v5.9.0" }}'
      KUBECTL_VERSION: '{{ .KUBECTL_VERSION | default "v1.35.0" }}'
    cmds:
      - defer: k3d cluster delete test-cluster
      - k3d cluster delete test-cluster
      - mkdir -p .act
      - test -x .act/k3d || curl -fsSL -o .act/k3d https://github.com/k3d-io/k3d/releases/download/{{ .K3D_VERSION }}/k3d-linux-amd64
      - test -x .act/kubectl || curl -fsSL -o .act/kubectl https://dl.k8s.io/release/{{ .KUBECTL_VERSION }}/bin/linux/amd64/kubectl
      - chmod +x .act/k3d .act/kubectl
      - >-
        act pull_request -j integration-test -P ubuntu-latest=catthehacker/ubuntu:act-latest
        --container-options "--privileged -v {{ .ROOT_DIR }}/.act/k3d:/usr/local/bin/k3d:ro -v {{ .ROOT_DIR }}/.act/kubectl:/usr/local/bin/kubectl:ro"
